<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Leatherbound — Calendar</title>
<!-- Three self-hosted faces. No network, no fallback to a system font mid-sentence. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/month.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/week.css">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></svg>
<div class="device"><div class="screen">
  <div class="island"></div>
  <header>
    <div class="status"><span>9:41</span><span>100%</span></div>
    <div class="bar">
      <div class="dd" id="dd">
        <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span class="gilt" id="ddl">Month</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="#3b2509" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="menu"><button>Day</button><button>Week</button><button class="on">Month</button><button>Year</button></div>
      </div>
      <div class="nav">
        <button id="prev" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11.5 3.5L6 9l5.5 5.5" fill="none" stroke="#3b2509" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="next" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M6.5 3.5L12 9l-5.5 5.5" fill="none" stroke="#3b2509" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="torn-wrap"><div class="torn"></div></div>
  </header>

  <main>
    <div class="trow">
      <h1><span id="mn"></span><span id="yr"></span></h1>
      <button class="back" id="back" hidden>today</button>
    </div>
    <div class="scroller" id="sc"><div class="sheet" id="sheet">
      <div class="wk"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
      <div class="gw"><div class="rules"></div><div class="grid" id="grid"></div></div>
    </div></div>
    <div class="wv"><div class="ws" id="ws"></div></div>
    <div class="dv" id="dv"></div>
    <div class="yv" id="yv"></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <section class="note" id="note" aria-label="Day notes">
    <div class="nh"><h2 id="nd" role="button" tabindex="0" title="Open this day"></h2><button class="x" id="close" aria-label="Close">&#10005;</button></div>
    <ul id="list"></ul>
    <input id="txt" placeholder="Write something down…" maxlength="40" enterkeyhint="done" autocomplete="off">
    <div class="tmrow"><label for="tm">at</label><input type="text" id="tm" inputmode="numeric" placeholder="--:--" maxlength="8" autocomplete="off" spellcheck="false"><span id="tmhint">blank = all day</span></div>
    <div class="addrow">
      <div class="cols" id="cols"></div>
      <button class="go" id="go">Add</button>
    </div>
  </section>
  <div class="cp" id="cp" role="dialog" aria-modal="true" aria-label="Colour">
    <div class="cpcard">
      <h3 id="cpt">New colour</h3>
      <div class="cpprev"><i id="cpsw"></i><input id="cphex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour"></div>
      <label class="cpr"><span>Hue</span><input type="range" id="cph" min="0" max="360"></label>
      <label class="cpr"><span>Rich</span><input type="range" id="cps" min="0" max="100"></label>
      <label class="cpr"><span>Light</span><input type="range" id="cpv" min="0" max="100"></label>
      <div class="cppre" id="cppre"></div>
      <div class="cpbtns"><button class="cpx rm" id="cprm">Remove</button><span class="sp"></span><button class="cpx" id="cpcancel">Cancel</button><button class="go cps" id="cpsave">Save</button></div>
    </div>
  </div>
</div></div>
