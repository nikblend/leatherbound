<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leatherbound — Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#d9d2c5;--page2:#b9b0a0;
  --paper:#fbf4e4;--paper-d:#f0e5cb;--ink:#33261a;--soft:#76603f;--pen:#27324f;--pencil:rgba(70,50,30,.5);--vermilion:#c9402c;--cell:100px;--rows:5;--wcol:96px;--circ:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 40'><path d='M22 3C10 2 2 10 3 21c1 11 11 17 22 15 12-2 17-11 15-21C38 8 29 3 18 5' fill='none' stroke='%23c9402c' stroke-width='2.2' stroke-linecap='round'/></svg>");
  --gilt:linear-gradient(180deg,#fff2b8 0%,#f0cb6e 45%,#c8963a 100%);
  --g1:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22 0 0 0 0 .13 0 0 0 0 .04 0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --g2:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1d1914;--page2:#0f0d0a}}
:root[data-theme="dark"]{--page:#1d1914;--page2:#0f0d0a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--page),var(--page2));display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid #2f7d79;outline-offset:2px}

.device{width:412px;height:866px;flex:none;background:linear-gradient(145deg,#3a3a3c,#0c0c0d 60%,#2a2a2c);border-radius:56px;padding:11px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1.5px #555 inset,0 2px 0 rgba(255,255,255,.15) inset}
.screen{position:relative;height:100%;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;background:var(--paper)}
.island{position:absolute;top:10px;left:50%;width:104px;height:28px;margin-left:-52px;border-radius:20px;background:#000;z-index:10}

header{position:relative;z-index:5;flex:none;padding:0 20px 24px;background:var(--g1),radial-gradient(ellipse at 30% 0%,rgba(255,236,190,.28),transparent 60%),linear-gradient(180deg,#c9a76b,#b8935a 55%,#a07b43);box-shadow:inset 0 1px 0 rgba(255,215,160,.45)}
header::before{content:'';position:absolute;left:0;right:0;bottom:12px;height:22px;background:linear-gradient(180deg,rgba(90,58,20,0),rgba(90,58,20,.3));pointer-events:none}
/* Saddle stitching: slanted, rounded waxed-thread stitches sitting in a pressed groove, with needle holes and a soft shadow under each stitch */
header::after{content:'';position:absolute;left:12px;right:12px;bottom:17px;height:8px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M0 4.5H12' stroke='%232a1604' stroke-opacity='.3' stroke-width='.9'/><g fill='none' stroke-linecap='round'><path d='M3.1 5.7L8.1 3.1' stroke='%23140a01' stroke-opacity='.5' stroke-width='2.1'/><path d='M3.1 5.2L8.1 2.6' stroke='%23857559' stroke-width='2'/><path d='M3.1 5L8.1 2.4' stroke='%23e6dcc6' stroke-width='1.3'/></g></svg>") 0 0/12px 8px repeat-x;pointer-events:none}
.status{height:46px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;font:700 14px system-ui,sans-serif;color:#3b2509;text-shadow:0 1px 0 rgba(255,236,190,.55)}
.bar{display:flex;justify-content:space-between;align-items:center;height:48px}
.gilt{color:#3b2509;text-shadow:0 1px 0 rgba(255,236,190,.6)}
.dd{position:relative}
.dd-btn{height:48px;display:flex;align-items:center;gap:8px;font:700 28px 'Playfair Display',Georgia,serif}
.dd-btn svg{transition:transform .2s;filter:drop-shadow(0 1px 0 rgba(255,236,190,.6))}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.menu{display:none;position:absolute;left:-6px;top:calc(100% + 6px);width:230px;padding:5px;border-radius:14px;background:var(--g2),linear-gradient(#fffdf4,#f1e8d0);box-shadow:0 14px 26px rgba(20,8,0,.55),0 0 0 1px rgba(90,60,20,.5),inset 0 1px 0 #fff}
.dd.open .menu{display:block}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;padding:0 16px;border-radius:9px;font:500 20px 'Playfair Display',Georgia,serif;text-align:left}
.menu button+button{border-top:1px solid rgba(120,90,40,.2)}
.menu button:active{background:#eadcb8}
.menu .on{font-weight:700}
.menu .on::after{content:'\2713';color:var(--vermilion);font:700 17px system-ui,sans-serif}
.nav{display:flex;margin-right:-10px}
.nav button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.nav button:active{background:rgba(90,55,15,.22);box-shadow:inset 0 2px 4px rgba(70,40,8,.45)}
.nav svg{filter:drop-shadow(0 1px 0 rgba(255,236,190,.6))}
.torn-wrap{position:absolute;left:0;right:0;bottom:-1px;filter:drop-shadow(0 -1px 1px rgba(30,12,0,.5))}
.torn{height:13px;background:var(--paper);clip-path:polygon(0 100%,0 55%,3% 35%,6% 62%,10% 28%,14% 55%,18% 40%,23% 66%,27% 30%,31% 52%,36% 34%,40% 64%,45% 38%,49% 58%,54% 26%,58% 56%,63% 36%,67% 62%,72% 30%,76% 54%,81% 38%,85% 64%,90% 32%,94% 58%,97% 42%,100% 55%,100% 100%)}

main{flex:1;overflow:auto;display:flex;flex-direction:column;background:var(--g2),linear-gradient(180deg,var(--paper),var(--paper-d));padding:8px 16px 110px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.trow{position:relative;display:flex;align-items:flex-end;justify-content:space-between;margin:8px 4px 10px}
h1{margin:0;font:700 36px/1.1 'Playfair Display',Georgia,serif;letter-spacing:-.01em;text-shadow:0 1px 0 #fff}
#yr{font:700 38px Caveat,cursive;color:#41659a;margin-left:8px;text-shadow:none}
.back{font:600 22px Caveat,cursive;color:#2f7d79;text-decoration:underline wavy rgba(47,125,121,.5);text-underline-offset:4px;padding:6px 4px 4px;min-height:44px}
.scroller{margin:0 -16px;padding:0 16px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:16px;scrollbar-width:none;cursor:grab}
.scroller::-webkit-scrollbar{display:none}
.sheet{width:max-content;padding-right:16px}
.sheet.turn{animation:turn .25s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(14px) rotate(.4deg)}}
.wk,.grid{display:grid;grid-template-columns:repeat(7,var(--cell))}
.wk span{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--soft);padding:0 0 8px 10px}
.gw{position:relative}
.rules{position:absolute;left:0;top:0;width:calc(7*var(--cell) + 2px);height:calc(var(--rows)*var(--cell) + 2px);pointer-events:none;filter:url(#wob);background:linear-gradient(to right,var(--pencil) 1.3px,transparent 1.3px) 0 0/var(--cell) var(--cell),linear-gradient(to bottom,var(--pencil) 1.3px,transparent 1.3px) 0 0/var(--cell) var(--cell)}
.grid{position:relative;grid-auto-rows:var(--cell)}
.day{position:relative;overflow:hidden;scroll-snap-align:start;padding:6px 5px 0 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.day b{display:block;font:700 28px/1.1 Caveat,cursive;color:var(--pen)}
.day.out b{color:#a99a7c;font-weight:500}
.day.sel{background:rgba(250,214,90,.3);border-radius:3px 7px 4px 6px}
.day b.today{width:42px;height:38px;margin:-4px 0 -3px -13px;padding:4px 0 0 0;text-align:center;color:var(--vermilion);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 40'><path d='M22 3C10 2 2 10 3 21c1 11 11 17 22 15 12-2 17-11 15-21C38 8 29 3 18 5' fill='none' stroke='%23c9402c' stroke-width='2.2' stroke-linecap='round'/></svg>") center/contain no-repeat}
.day u{display:block;align-self:stretch;margin:4px 0 0 -2px;padding:0 3px 1px 5px;font:600 16px/1.25 Caveat,cursive;color:#1f2540;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);border-radius:2px 6px 4px 7px;background:color-mix(in srgb,var(--c) 28%,transparent);transform:rotate(-.8deg)}
.day u+u{transform:rotate(.7deg)}
.day em{position:absolute;right:7px;top:11px;display:flex;align-items:center;gap:3px;font:700 17px Caveat,cursive;font-style:normal;color:var(--soft)}
.day s{width:9px;height:9px;border-radius:50%;background:var(--c);text-decoration:none;box-shadow:0 1px 1px rgba(40,20,0,.35)}

.fab{position:absolute;left:50%;bottom:30px;margin-left:-34px;width:68px;height:68px;border-radius:50%;z-index:6;display:grid;place-items:center;background:var(--g1),radial-gradient(ellipse at 30% 0%,rgba(255,236,190,.28),transparent 60%),linear-gradient(165deg,#c9a76b,#b8935a 55%,#a07b43);box-shadow:0 0 0 1px rgba(60,35,8,.5),0 2px 3px rgba(40,20,0,.5),0 10px 18px -4px rgba(40,20,0,.45),inset 0 1px 0 rgba(255,225,170,.45),inset 0 -2px 4px rgba(70,40,8,.4);transition:transform .08s,box-shadow .08s}
.fab .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.fab:active{transform:translateY(2px) scale(.97);box-shadow:0 3px 6px rgba(40,20,0,.5),inset 0 2px 6px rgba(10,4,0,.6)}

.scrim{position:absolute;inset:0;z-index:15;background:rgba(30,15,3,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.note{position:absolute;left:0;right:0;bottom:0;z-index:20;min-height:64%;max-height:92%;display:flex;flex-direction:column;padding:20px 20px 32px;border-radius:24px 24px 0 0;background:var(--g2),linear-gradient(#fffaf0,#f3e8cf);box-shadow:0 -10px 30px rgba(30,15,3,.45),inset 0 1px 0 #fff;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);visibility:hidden}
.note.open{transform:none;visibility:visible}
.nh{display:flex;justify-content:space-between;align-items:center}
.nh h2{margin:0;padding-left:6px;font:700 40px Caveat,cursive;color:var(--pen)}
.x{width:44px;height:44px;border-radius:50%;font-size:18px;color:var(--soft)}
#list:empty{margin:0}
#list{list-style:none;margin:8px 0 20px;padding:0;overflow:auto;background:repeating-linear-gradient(to bottom,transparent 0 43px,rgba(65,101,154,.22) 43px 44px)}
#list li{display:flex;align-items:center;gap:12px;height:44px;font:600 26px/1 Caveat,cursive;color:var(--pen)}
#list li i{width:14px;height:14px;margin:0 6px 0 6px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 1px 1px rgba(40,20,0,.35)}
#list li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list li button{width:44px;height:44px;color:var(--soft);font-size:16px}
#list li.none{padding-left:50px;color:var(--soft);font-weight:500}
#txt{width:100%;height:62px;margin-top:6px;padding:0 0 0 6px;font:600 30px Caveat,cursive;color:var(--pen);background:none;border:0;border-bottom:1.5px dashed rgba(39,50,80,.4);border-radius:0;outline:0}
#txt::placeholder{color:#9a8a6c}
.addrow{display:flex;flex-direction:column;gap:26px;margin-top:30px}
.cols{display:flex;flex-wrap:wrap;gap:10px 14px;padding-left:2px}
.cols button{width:50px;height:50px;display:grid;place-items:center}
.cols button::before{content:'';width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 3px rgba(0,0,0,.25),0 1px 2px rgba(40,20,0,.4)}
.cols .on::before{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--c)}
.cols .add::before{content:'+';display:grid;place-items:center;font:500 28px/1 system-ui,sans-serif;color:var(--soft);background:none;box-shadow:none;border:2px dashed rgba(118,96,63,.6)}
.cols .add:active::before{background:rgba(118,96,63,.12)}
.cols button{touch-action:manipulation;-webkit-touch-callout:none;user-select:none}
.go{width:100%;height:60px;padding:0 28px;border-radius:30px;font:700 25px 'Playfair Display',Georgia,serif;color:#3b2509;text-shadow:0 1px 0 rgba(255,236,190,.6);background:var(--g1),linear-gradient(#cfae72,#b08a50);box-shadow:0 2px 4px rgba(40,20,0,.5),inset 0 1px 0 rgba(255,244,214,.6)}
.go:active{box-shadow:inset 0 2px 5px rgba(10,4,0,.7)}

.wv{display:none;position:relative;flex:1;min-height:0}
main[data-v=week]{overflow:hidden;padding:8px 0 0}
main[data-v=week] #sc{display:none}
main[data-v=week] .wv{display:block}
main[data-v=week] .trow{margin:8px 20px 8px}
main[data-v=week] h1{font-size:30px}
main[data-v=week] #yr{font-size:32px}
.ws{position:absolute;inset:0;overflow:auto;scrollbar-width:none;cursor:grab}
.ws::-webkit-scrollbar{display:none}
/* ===== OLD hour-by-hour week grid styles (commented out, replaced by the agenda list below) =====
.wgrid{width:max-content;min-width:100%}
.wgrid.turn{animation:turn .25s ease-out}
.wh,.wr,.wb{display:grid;grid-template-columns:46px repeat(7,var(--wcol))}
.wh{position:sticky;top:0;z-index:4;height:70px;background:var(--g2),var(--paper);box-shadow:0 1px 0 var(--pencil)}
.wr{position:sticky;top:70px;z-index:3;min-height:40px;background:var(--g2),var(--paper);box-shadow:0 1px 0 var(--pencil)}
.rl0{position:sticky;left:0;z-index:6;background:var(--g2),var(--paper)}
.al{font:600 15px Caveat,cursive;color:var(--soft);padding:10px 0 0 14px}
.wd{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 0 0 12px;text-align:left}
.wd span{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--soft)}
.wd b{display:block;font:700 30px/1.1 Caveat,cursive;color:var(--pen)}
.wd.t b{width:42px;height:38px;margin:0 0 -3px -13px;padding:4px 0 0;text-align:center;color:var(--vermilion);background:var(--circ) center/contain no-repeat}
.wd.t,.wa1.t,.col.t{background:rgba(250,214,90,.2)}
.wa1{display:flex;flex-direction:column;gap:3px;padding:6px 4px;min-height:40px}
.wa1 u,.we{display:block;padding:0 4px 1px 6px;font:600 16px/1.2 Caveat,cursive;color:#1f2540;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);border-radius:2px 6px 4px 7px;background:color-mix(in srgb,var(--c) 28%,transparent)}
.we{position:absolute;padding:4px 5px 3px 7px;white-space:normal;font-size:17px;line-height:1.15;transform:rotate(-.5deg)}
.we small{display:block;font:600 14px Caveat,cursive;color:var(--soft)}
.wb{position:relative;padding:10px 0 96px}
.lines{position:absolute;left:46px;top:10px;width:calc(7*var(--wcol) + 2px);height:962px;pointer-events:none;filter:url(#wob);background:linear-gradient(to right,var(--pencil) 1.3px,transparent 1.3px) 0 0/var(--wcol) 100%,linear-gradient(to bottom,var(--pencil) 1.3px,transparent 1.3px) 0 0/100% 60px}
.rl{position:sticky;left:0;z-index:2;height:960px;background:var(--g2),var(--paper)}
.rl span{position:absolute;right:8px;font:600 12px Georgia,serif;color:var(--soft);white-space:nowrap}
.col{position:relative;height:960px}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--vermilion);z-index:1;pointer-events:none}
.now::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--vermilion)}
===== end OLD week styles ===== */

/* ===== NEW week view: one large, detailed row per day (scrolls) ===== */
.wl{display:flex;flex-direction:column;padding:0 16px 120px}
.wl.turn{animation:turn .25s ease-out}
.wday{display:flex;gap:14px;align-items:flex-start;width:100%;min-height:132px;padding:16px 8px 16px 0;text-align:left;border-bottom:1.3px solid var(--pencil)}
.wday.t{background:rgba(250,214,90,.22);border-radius:3px 7px 4px 6px}
.wday.past{opacity:.6}
.wdn{flex:none;width:68px;display:flex;flex-direction:column;align-items:center}
.wdn span{font:700 21px/1.1 'Playfair Display',Georgia,serif;letter-spacing:0;color:var(--ink)}
.wday.t .wdn span{color:var(--vermilion)}
.wdn b{display:block;font:700 44px/1.05 Caveat,cursive;color:var(--pen)}
.wdn small{margin-top:4px;font:600 17px Caveat,cursive;color:var(--soft);white-space:nowrap}
.wday.t .wdn b{width:58px;height:52px;margin-bottom:-2px;padding:6px 0 0;text-align:center;color:var(--vermilion);background:var(--circ) center/contain no-repeat}
.wev{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;padding-top:4px}
.ev{display:flex;align-items:flex-start;gap:10px;min-width:0}
.ev .tm{flex:none;width:72px;padding-top:4px;font:600 22px/1.2 Caveat,cursive;color:var(--soft);text-align:right}
.ev .tx{flex:1;min-width:0;display:block;padding:4px 10px 5px 10px;font:600 26px/1.2 Caveat,cursive;color:#1f2540;white-space:normal;overflow-wrap:anywhere;border-left:4px solid var(--c);border-radius:2px 8px 5px 9px;background:color-mix(in srgb,var(--c) 28%,transparent)}
.ev.all .tm{font-size:19px}
.wev .none{font:500 25px Caveat,cursive;color:#a99a7c;padding-top:8px}
/* ===== end NEW week styles ===== */
.tmrow{display:flex;align-items:center;gap:14px;margin-top:20px;padding-left:6px;font:600 26px Caveat,cursive;color:var(--soft)}
.tmrow span{font-size:18px;font-weight:500}
#tmhint.ok{color:#2f7d79;font-weight:600}
#tm{height:54px;width:156px;font:600 28px Caveat,cursive;color:var(--pen);background:none;border:0;border-bottom:1.5px dashed rgba(39,50,80,.4);border-radius:0;outline:0}
#list li small{font:600 19px Caveat,cursive;color:var(--soft);margin-left:8px}
.cols .edit::before{content:'';background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z M14.5 6.5l3 3' fill='none' stroke='%23766040' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'/></svg>") center/20px no-repeat;box-shadow:none;border:2px dashed rgba(118,96,63,.6)}
.cols .edit:active::before{background-color:rgba(118,96,63,.12)}
.cp{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(30,15,3,.58)}
.cp.on{display:flex;animation:cpfade .18s ease-out}
@keyframes cpfade{from{opacity:0}}
@keyframes cppop{from{transform:scale(.94);opacity:0}}
.cpcard{width:min(334px,calc(100% - 32px));padding:20px 20px 18px;border-radius:22px;background:var(--g2),linear-gradient(#fffaf0,#f1e6cb);animation:cppop .2s ease-out;box-shadow:0 24px 48px rgba(20,8,0,.6),0 4px 9px rgba(20,8,0,.35),0 0 0 1px rgba(90,60,20,.55),inset 0 2px 0 #fff,inset 0 -3px 6px rgba(120,85,30,.28),inset 2px 0 0 rgba(255,255,255,.55),inset -2px 0 0 rgba(120,85,30,.14)}
.cpcard h3{margin:0 0 14px;font:700 28px Caveat,cursive;color:var(--pen);text-align:center}
.cpprev{display:flex;align-items:center;gap:18px;padding:12px 16px;border-radius:14px;background:rgba(90,60,20,.07);box-shadow:inset 0 2px 5px rgba(70,40,8,.38),0 1px 0 #fff}
#cpsw{flex:none;width:54px;height:54px;border-radius:50%;background:var(--c);box-shadow:inset 0 -4px 6px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.4),0 0 0 3px #fffaf0,0 0 0 4.5px rgba(90,60,20,.5),0 3px 6px rgba(40,20,0,.45)}
#cphex{flex:1;min-width:0;height:46px;font:600 30px Caveat,cursive;letter-spacing:.04em;color:var(--pen);background:none;border:0;border-bottom:1.5px dashed rgba(39,50,80,.4);border-radius:0;outline:0;text-transform:uppercase}
.cpr{display:flex;align-items:center;gap:12px;margin-top:16px}
.cpr span{flex:none;width:50px;font:600 22px Caveat,cursive;color:var(--soft)}
.cpr input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;margin:0;background:transparent;cursor:pointer}

function load(){
  var o=null;

  if(!o||typeof o!=='object'||Array.isArray(o))return {};
  /* storage can be edited, truncated or written by an older build: drop anything
     that would break a render, and never let a bad entry take the whole page down */
  var chg=false;
  Object.keys(o).forEach(function(q){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(q)||!Array.isArray(o[q])){delete o[q];chg=true;return}
    var out=[];
    o[q].forEach(function(e){

      var n={t:e.t,c:(typeof e.c==='string'&&COL[e.c])?e.c:PALORDER[0]};
      if(n.c!==e.c)chg=true;

      out.push(n);

      Object.keys(o).forEach(function(q){
        o[q]=o[q].filter(function(e){return !isDemo(e)});
        if(!o[q].length)delete o[q];
      });
      localStorage.setItem('lb-demo-scrub','1');chg=true;

function parseTime(t){
  if(!t)return null;
  /* only shapes that read as a time get through: 8:40 · 8h40 · 0840 · 9 · 8:40pm.
     Anything else ("map", "1.5", "n0pe", "blah") is not a time and must not become one. */

      m1=s.match(/^(\d{1,2})(?:[:h](\d{1,2}))?([ap]m?)?$/),m2=s.match(/^(\d{3,4})([ap]m?)?$/);

  else if(m2){h=+m2[1].slice(0,-2);mi=+m2[1].slice(-2);ap=m2[2]||''}
  else return null;
  if(ap){h=h%12;if(ap.charAt(0)==='p')h+=12}
